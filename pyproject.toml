[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-hypergraph-partition"
version = "0.1.0a4"
description = "Catalytic QUBO hypergraph partitioning with a protected FEM engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Baijian Yao", email = "byao@connect.ust.hk"}]

[project.optional-dependencies]
native = ["torch>=2.5,<3", "scipy>=1.11,<2"]
test = ["pytest>=7"]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
fem-hypergraph = "fem_hypergraph_partition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fem_hypergraph_partition = ["_engine/*.so", "_engine/*.json", "_engine/*.cubin"]
