name: Sync clean public release
on:
  push:
    branches: [public-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/public-release' && github.repository != 'yao-baijian/qubo-hypergraph-partition'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch only the clean release branch, test and sync
        env:
          PRIVATE_READ_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_RELEASE_TOKEN" ]; then
            echo '::error::Set PUBLIC_RELEASE_TOKEN in the private repository; grant Contents write only on qubo-hypergraph-partition.'
            exit 1
          fi
          helper="$RUNNER_TEMP/fem-release-askpass"
          trap 'rm -f "$helper"' EXIT
          cat > "$helper" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$SYNC_GIT_TOKEN" ;;
          esac
          SH
          chmod 700 "$helper"
          export GIT_ASKPASS="$helper"
          export SYNC_GIT_TOKEN="$PRIVATE_READ_TOKEN"
          git init release
          cd release
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin refs/heads/public-release
          git checkout --detach FETCH_HEAD
          python3 .github/scripts/audit_tree.py
          python3 -m pip install '.[test]'
          python3 -m pytest -q tests
          export SYNC_GIT_TOKEN="$PUBLIC_RELEASE_TOKEN"
          git remote add public https://github.com/yao-baijian/qubo-hypergraph-partition.git
          git fetch --no-tags public refs/heads/main:refs/remotes/public/main
          git merge-base --is-ancestor refs/remotes/public/main HEAD
          git push public HEAD:refs/heads/main
